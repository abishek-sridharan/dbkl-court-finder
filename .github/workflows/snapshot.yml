name: Snapshot DBKL availability

on:
  schedule:
    # Hourly. A full two-date sweep takes ~20 minutes from CI at this pacing, so
    # a 30-minute cadence would leave almost no headroom. Age costs little: the
    # snapshot exists to make the first paint instant, and anything past the
    # cache TTL is refetched live anyway, so an older snapshot means more
    # venues refreshed — not staler data on screen.
    - cron: '17 * * * *'
  workflow_dispatch:

# Actions defaults to read-only on this repo, and the job pushes.
permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sweep DBKL
        run: node scripts/snapshot.mjs --days 2 --out snapshot/badminton.json

      # Published to an orphan branch that is replaced each run, not appended to.
      # A ~100 KB file rewritten 48 times a day would add gigabytes to main's
      # history within a year and trigger a redeploy every time; force-pushing a
      # single-commit branch keeps the repo flat and decouples data from deploys.
      - name: Publish to the data branch
        run: |
          # --global: these run before `git init` below, and a repo-local
          # `git config` would land on the checked-out repo rather than the
          # fresh one, leaving it with no author and failing the commit.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/publish/snapshot
          cp snapshot/badminton.json /tmp/publish/snapshot/
          # Carried onto the data branch as well as main: Vercel's docs do not
          # say which branch it reads this from, and a data push that builds is
          # a guaranteed failure — the branch holds one JSON file and no app.
          cp vercel.json /tmp/publish/
          cd /tmp/publish
          git init -q -b data
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "snapshot: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push -q --force origin data
