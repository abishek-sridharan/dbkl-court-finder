<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DBKL Court Finder</title>
    <meta name="description" content="Live badminton, futsal and sports court availability across 59+ DBKL facilities in Kuala Lumpur. Filter by consecutive hours, time window and distance." />
    <!-- One tag, kept in step with the resolved theme by the script below and by
         useTheme. A pair gated on prefers-color-scheme would follow the OS and
         so contradict the page as soon as the user overrides the theme.
         These values mirror --color-bg-base in src/index.css. -->
    <meta name="theme-color" content="#f8fafc" />
    <meta property="og:title" content="DBKL Court Finder" />
    <meta property="og:description" content="Live sports court availability across DBKL facilities in Kuala Lumpur." />
    <meta property="og:type" content="website" />
    <!-- The whole page is gated on this host, and the first request only starts
         once the bundle boots — warm the connection while the JS downloads.
         crossorigin is required for CORS-mode fetch() to reuse the connection. -->
    <link rel="preconnect" href="https://apihub.dbkl.gov.my" crossorigin />
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before paint to prevent FOUC.
      (function () {
        var isDark = false;
        try {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          // No matchMedia; stay light.
        }
        try {
          // Only 'light' and 'dark' override the OS. 'system' — and a missing
          // key, and anything unrecognised — mean follow it.
          var stored = localStorage.getItem('theme');
          if (stored === 'dark') isDark = true;
          else if (stored === 'light') isDark = false;
        } catch (e) {
          // Storage unavailable — keep the OS preference rather than forcing light.
        }
        document.documentElement.classList.toggle('dark', isDark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#0f172a' : '#f8fafc');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
